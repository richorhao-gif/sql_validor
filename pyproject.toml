[project]
name = "sql-validator"
version = "0.1.0"
description = "数据仓库发版 SQL 脚本变更校验智能体"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=1.1",
    "langchain>=0.3",
    "langchain-community>=0.3",
    "langchain-openai>=0.2",
    "sqlglot[rs]>=25",
    "psycopg[binary]>=3",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-mock>=3.14",
    "ruff>=0.6",
    "mypy>=1.10",
    "ipykernel>=6",
    "langfuse>=3,<4",     # 本地可观测（配合 docker-compose 中的 LangFuse v3 服务）
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sql_validator"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP"]
ignore = ["N816"]

[tool.ruff.lint.isort]
known-first-party = ["sql_validator"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
